<!doctype html>
<html lang="en" id="bui">
<head>
  <meta charset="utf-8"/>
  <title>ISPNest</title>
  <base href="/"/>
  <meta
    name="description"
    content="ISPNest portal."
  />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="icon" type="image/x-icon" href="favicon.ico"/>

  <!-- PWA -->
  <link
    rel="manifest"
    href="/manifest.json"
  />


  <!-- Fonts -->
  <link
    rel="preload"
    href="/fonts/inter/InterVariable.woff2"
    as="font"
    type="font/woff2"
    crossorigin
  />
  <link
    rel="preload"
    href="/fonts/inter/InterVariable-Italic.woff2"
    as="font"
    type="font/woff2"
    crossorigin
  />
  <link
    rel="preload"
    href="/fonts/commit-mono/CommitMonoVariable.woff2"
    as="font"
    type="font/woff2"
    crossorigin
  />
</head>
<body>
<!-- prettier-ignore -->
<script>
  !function () {
    try {
      const e = document.documentElement.classList;
      e.remove("scheme-dark", "scheme-light");
      const c = localStorage.getItem("scheme"), t = window.matchMedia("(prefers-color-scheme: dark)").matches,
        s = "dark" === c || "system" === c && t ? "scheme-dark" : "scheme-light";
      e.add(s)
    } catch (e) {
    }
  }();
</script>
<app-root></app-root>
</body>
</html>
